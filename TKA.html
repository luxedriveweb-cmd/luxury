<script>
const subjects=[
{id:'indo',name:'Bahasa Indonesia',type:'Wajib',icon:'📘',desc:'Literasi, teks, simpulan'},

];
const tests={
indo:[
{title:'Sub Test 1 · Literasi Teks',time:20,qs:[
{q:'Bacalah pernyataan berikut: “Ruang terbuka hijau dapat menurunkan suhu lingkungan dan menjadi tempat interaksi warga.” Gagasan utama kalimat tersebut adalah ...',o:['Ruang terbuka hijau hanya untuk bermain','Manfaat ruang terbuka hijau bagi lingkungan dan warga','Suhu lingkungan selalu meningkat','Warga tidak membutuhkan ruang terbuka'],a:1,exp:'Kalimat menyebut dua manfaat utama, yaitu membantu menurunkan suhu dan menyediakan ruang interaksi. Jadi gagasan utamanya adalah manfaat ruang terbuka hijau.',kind:'text'},
{q:'Sebuah artikel menyatakan bahwa kebiasaan membaca 15 menit setiap hari memperkaya kosakata. Simpulan yang paling tepat adalah ...',o:['Membaca singkat secara rutin dapat mendukung perkembangan kosakata','Kosakata hanya berkembang melalui hafalan','Membaca harus dilakukan berjam-jam','Semua buku memiliki tingkat kesulitan sama'],a:0,exp:'Simpulan harus sejalan dengan informasi teks tanpa menambahkan klaim yang tidak disebutkan.',kind:'text'},
{q:'Kata “namun” dalam sebuah paragraf umumnya menandai hubungan ...',o:['Penambahan','Sebab-akibat','Pertentangan','Urutan waktu'],a:2,exp:'“Namun” merupakan konjungsi pertentangan, digunakan ketika informasi berikutnya berlawanan atau membatasi informasi sebelumnya.',kind:'text'}]},
{title:'Sub Test 2 · Menilai Informasi',time:20,qs:[
{q:'Pernyataan: “Sebagian besar siswa dalam survei kelas memilih perpustakaan yang nyaman.” Informasi yang dapat dipastikan adalah ...',o:['Semua siswa di sekolah menyukai perpustakaan','Hasil survei kelas menunjukkan pilihan mayoritas pada perpustakaan nyaman','Perpustakaan selalu ramai setiap hari','Semua sekolah memiliki perpustakaan nyaman'],a:1,exp:'Kesimpulan dibatasi pada responden survei kelas. Tidak tepat menggeneralisasi hasil ke semua siswa atau sekolah.',kind:'text'},
{q:'Kalimat yang paling efektif adalah ...',o:['Para siswa-siswa sedang belajar bersama-sama','Siswa kelas XII sedang berdiskusi di perpustakaan','Agar supaya lulus, maka ia belajar','Banyak buku-buku dibaca oleh para siswa'],a:1,exp:'Pilihan B hemat kata dan memiliki struktur yang jelas. Pilihan lain mengandung pemborosan kata.',kind:'text'},
{q:'Dalam teks argumentasi, data statistik terutama berfungsi untuk ...',o:['Menggantikan seluruh pendapat penulis','Memperkuat alasan dengan bukti terukur','Membuat teks menjadi lebih panjang','Menghibur pembaca dengan cerita'],a:1,exp:'Data statistik memberikan bukti terukur yang dapat mendukung argumen, selama sumber dan konteksnya jelas.',kind:'text'}]}],
mat:[
{title:'Sub Test 1 · Aljabar & Fungsi',time:25,qs:[
{q:'Jika 2x − 5 = 11, nilai x adalah ...',o:['3','6','8','13'],a:2,exp:'Tambahkan 5 pada kedua ruas: 2x = 16. Bagi kedua ruas dengan 2, sehingga x = 8.',kind:'math'},
{q:'Akar-akar persamaan x² − 5x + 6 = 0 adalah ...',o:['1 dan 6','−2 dan −3','2 dan 3','−1 dan −6'],a:2,exp:'Faktorkan: (x − 2)(x − 3) = 0. Maka x = 2 atau x = 3.',kind:'math'},
{q:'Diketahui f(x) = 3x + 2. Nilai f(4) adalah ...',o:['10','12','14','16'],a:2,exp:'Substitusi x = 4: f(4) = 3(4) + 2 = 14.',kind:'math'}]},
{title:'Sub Test 2 · Data & Peluang',time:25,qs:[
{q:'Rata-rata dari 4, 6, 8, 10, dan 12 adalah ...',o:['6','7','8','9'],a:2,exp:'Jumlah data = 40. Banyak data = 5. Rata-rata = 40 ÷ 5 = 8.',kind:'math'},
{q:'Sebuah dadu bersisi enam dilempar sekali. Peluang muncul angka genap adalah ...',o:['1/6','1/3','1/2','2/3'],a:2,exp:'Angka genap yang mungkin: 2, 4, 6. Ada 3 hasil dari 6 hasil setara, sehingga peluang = 3/6 = 1/2.',kind:'math'},
{q:'Median dari data 3, 5, 7, 8, 11 adalah ...',o:['5','7','8','11'],a:1,exp:'Data sudah berurutan dan jumlahnya 5. Median adalah nilai di posisi tengah, yaitu 7.',kind:'math'}]}],
ing:[
{title:'Sub Test 1 · Reading Comprehension',time:20,qs:[
{q:'Read: “Mira brings a reusable bottle to school because she wants to reduce plastic waste.” Why does Mira bring a reusable bottle?',o:['She dislikes drinking water','She wants to reduce plastic waste','Her school sells bottles','She forgot her bag'],a:1,exp:'The text explicitly says she brings it because she wants to reduce plastic waste.',kind:'text'},
{q:'Choose the closest meaning of “essential”.',o:['Unnecessary','Very important','Unusual','Temporary'],a:1,exp:'“Essential” means necessary or very important.',kind:'text'},
{q:'Read: “Although the weather was rainy, the match continued.” The word “although” expresses ...',o:['Contrast','Cause','Addition','Time sequence'],a:0,exp:'“Although” introduces a contrast between rainy weather and the match continuing.',kind:'text'}]},
{title:'Sub Test 2 · Inference & Vocabulary',time:20,qs:[
{q:'“The library was packed, so Rani looked for a quiet corner upstairs.” What can be inferred?',o:['The library had many people','The library was closed','Rani wanted to leave school','The upstairs area was noisy'],a:0,exp:'“Packed” means very crowded, so it can be inferred that many people were in the library.',kind:'text'},
{q:'Choose the grammatically correct sentence.',o:['He go to school every day.','He goes to school every day.','He going to school every day.','He gone to school every day.'],a:1,exp:'For simple present with he/she/it, the verb generally takes -s or -es: “He goes”.',kind:'text'},
{q:'The opposite of “increase” is ...',o:['Expand','Improve','Decrease','Include'],a:2,exp:'“Decrease” means to become smaller or lower, the opposite of “increase”.',kind:'text'}]}],
mtl:[
{title:'Sub Test 1 · Limit & Turunan',time:30,qs:[
{q:'Nilai lim x→2 (x² − 4)/(x − 2) adalah ...',o:['0','2','4','Tidak terdefinisi'],a:2,exp:'Faktorkan x² − 4 = (x − 2)(x + 2). Untuk x ≠ 2, bentuknya menjadi x + 2. Saat x mendekati 2, limitnya 4.',kind:'graph'},
{q:'Jika f(x) = x³ − 2x, maka f′(x) adalah ...',o:['3x² − 2','x² − 2','3x − 2','x³ − 2'],a:0,exp:'Gunakan aturan pangkat: turunan x³ adalah 3x², turunan −2x adalah −2. Jadi f′(x) = 3x² − 2.',kind:'math'},
{q:'Determinan matriks [[2,1],[3,4]] adalah ...',o:['3','5','8','11'],a:1,exp:'Determinan matriks 2×2 adalah ad − bc. Jadi (2×4) − (1×3) = 8 − 3 = 5.',kind:'math'}]},
{title:'Sub Test 2 · Fungsi & Geometri',time:30,qs:[
{q:'Jika g(x) = 2x² + 1, maka g(−2) = ...',o:['5','7','9','11'],a:3,exp:'g(−2) = 2(−2)² + 1 = 2(4) + 1 = 9. Periksa kembali opsi: nilai yang benar adalah 9.',a:2,kind:'math'},
{q:'Vektor u = (3,4). Panjang vektor u adalah ...',o:['4','5','7','25'],a:1,exp:'Panjang vektor = √(3² + 4²) = √25 = 5.',kind:'math'},
{q:'Turunan dari f(x) = sin x adalah ...',o:['−sin x','cos x','−cos x','tan x'],a:1,exp:'Aturan turunan trigonometri dasar menyatakan d/dx(sin x) = cos x.',kind:'math'}]}],
fis:[
{title:'Sub Test 1 · Gerak & Gaya',time:30,qs:[
{q:'Sebuah benda bergerak dengan kecepatan tetap 12 m/s selama 5 s. Jarak yang ditempuh adalah ...',o:['17 m','24 m','60 m','120 m'],a:2,exp:'Gerak dengan kecepatan tetap: s = v × t = 12 × 5 = 60 m.',kind:'diagram'},
{q:'Gaya resultan 10 N bekerja pada benda bermassa 2 kg. Percepatan benda adalah ...',o:['2 m/s²','5 m/s²','10 m/s²','20 m/s²'],a:1,exp:'Hukum II Newton: F = ma, sehingga a = F/m = 10/2 = 5 m/s².',kind:'diagram'},
{q:'Energi kinetik benda bermassa 2 kg yang bergerak 3 m/s adalah ...',o:['3 J','6 J','9 J','18 J'],a:2,exp:'Ek = ½mv² = ½ × 2 × 3² = 9 J.',kind:'diagram'}]},
{title:'Sub Test 2 · Listrik & Gelombang',time:30,qs:[
{q:'Tegangan 12 V dipasang pada hambatan 4 Ω. Arus listriknya adalah ...',o:['0,33 A','2 A','3 A','48 A'],a:2,exp:'Hukum Ohm: I = V/R = 12/4 = 3 A.',kind:'diagram'},
{q:'Gelombang memiliki frekuensi 5 Hz dan panjang gelombang 2 m. Cepat rambatnya adalah ...',o:['2,5 m/s','7 m/s','10 m/s','25 m/s'],a:2,exp:'v = fλ = 5 × 2 = 10 m/s.',kind:'diagram'},
{q:'Dua hambatan 2 Ω dan 4 Ω disusun seri. Hambatan totalnya ...',o:['1,3 Ω','2 Ω','4 Ω','6 Ω'],a:3,exp:'Pada rangkaian seri, hambatan dijumlahkan: Rtotal = 2 + 4 = 6 Ω.',kind:'diagram'}]}]
};
try{const savedTests=JSON.parse(localStorage.getItem('tkaQuestionEdits')||'null');if(savedTests){Object.keys(savedTests).forEach(id=>{if(tests[id])savedTests[id].forEach((t,i)=>{if(tests[id][i])tests[id][i].qs=t.qs})})}}catch(e){console.warn('Bank soal lokal tidak dapat dibaca',e)}
let user=JSON.parse(localStorage.getItem('tkaUser')||'null');
let activePage='home';
const roleNames={student:'Siswa',teacher:'Guru',admin:'Admin'};
let records=JSON.parse(localStorage.getItem('tkaRecords')||'[]');
let current={subject:'mat',test:0,index:0,answers:{},started:0,seconds:0};
let lastResult=null;
function save(){localStorage.setItem('tkaUser',JSON.stringify(user));localStorage.setItem('tkaRecords',JSON.stringify(records))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2300)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(page){activePage=page;if(['dashboard','tests','rank','keys','explain','profile','manageQuestions','progress'].includes(page)&&!user)return go('login');if(page==='manageQuestions'&&!['admin','teacher'].includes(user?.role))return go('dashboard');if(page==='progress'&&!['admin','teacher'].includes(user?.role))return go('dashboard');if(page==='login'||page==='register')renderAuth(page);else if(page==='home')renderHome();else if(page==='dashboard')renderDashboard();else if(page==='tests')renderTests();else if(page==='rank')renderRank();else if(page==='keys')renderKeys();else if(page==='explain')renderExplain();else if(page==='profile')renderProfile();else if(page==='manageQuestions')renderQuestionManager();else if(page==='progress')renderStudentProgress();else renderHome();window.scrollTo(0,0);updateNav()}
function updateNav(){let nav=document.getElementById('topNav');nav.innerHTML=user?`<button class="btn secondary small" onclick="go('home')">Beranda</button><button class="btn secondary small" onclick="go('dashboard')">Dashboard</button>${['admin','teacher'].includes(user.role)?'<button class="btn secondary small" onclick="go(\'progress\')">Progress Siswa</button><button class="btn secondary small" onclick="go(\'manageQuestions\')">Kelola Soal</button>':''}<button class="btn secondary small" onclick="go('profile')">${roleNames[user.role]||'Siswa'}</button><button class="btn primary small" onclick="logout()">Keluar</button>`:`<button class="btn secondary small" onclick="go('home')">Beranda</button><button class="btn secondary small" onclick="go('login')">Login</button><button class="btn primary small" onclick="go('register')">Daftar</button>`}
function renderHome(){document.getElementById('app').innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Persiapan TKA · Kelas XII · 2026</div><h1>Uji kemampuanmu.<br><span>Raih targetmu.</span></h1><p>Latihan soal TKA dengan subtes terpisah, penilaian otomatis, kunci jawaban, pembahasan, dan peringkat latihanmu.</p><div class="hero-actions"><button class="btn primary" onclick="go('${user?'dashboard':'register'}')">Mulai latihan →</button><button class="btn secondary" onclick="go('tests')">Jelajahi subtes</button></div><div class="feature-row"><div class="feature">📝 <strong>Subtes Terpisah</strong>Latihan per topik</div><div class="feature">📊 <strong>Skor Otomatis</strong>Hasil setelah submit</div><div class="feature">💡 <strong>Pembahasan</strong>Langkah dan ilustrasi</div></div><div class="orb"></div></div><div class="hero-card"><div><span class="pill">YOUR PRACTICE HUB</span><h2>Siap menghadapi<br>TKA 2026?</h2><p>Bangun konsistensi sedikit demi sedikit. Setiap latihan adalah progres.</p></div><div class="hero-art">🎓📚</div><div><b>5 mata pelajaran</b><p style="margin:4px 0">3 wajib · 2 pilihan yang kamu fokuskan</p></div></div></section><section><div class="section-head"><div><h2>Mata Pelajaran</h2><p>Pilih mapel lalu kerjakan setiap subtes secara terpisah.</p></div><span class="pill">5 MAPEL</span></div><div class="subjects">${subjects.map(s=>`<article class="subject-card"><div class="subject-icon">${s.icon}</div><span class="pill">${s.type}</span><h3>${s.name}</h3><p>${s.desc}</p><button class="btn secondary small" onclick="openSubject('${s.id}')">Lihat subtes →</button></article>`).join('')}</div></section>`}
function sidebar(active){let links=[['dashboard','⌂','Dashboard']];if(user?.role==='student')links.push(['tests','▤','Latihan Soal'],['rank','♛','Hasil & Peringkat'],['keys','✓','Kunci Jawaban'],['explain','✎','Pembahasan']);if(['teacher','admin'].includes(user?.role))links.push(['progress','▥','Progress Siswa'],['manageQuestions','✎','Kelola Soal']);links.push(['profile','◉','Profil']);return `<aside class="panel sidebar"><div class="side-title">${roleNames[user?.role]||'Menu'} · Menu</div>${links.map(x=>`<button class="side-link ${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}　${x[2]}</button>`).join('')}<div class="side-title">Akun</div><button class="side-link" onclick="logout()">↪　Keluar</button></aside>`}
function shell(active,content){document.getElementById('app').innerHTML=`<div class="layout">${sidebar(active)}<section>${content}</section></div>`}
function renderDashboard(){if(['admin','teacher'].includes(user.role))return renderStaffDashboard();let my=records.filter(r=>r.user===user.name),avg=my.length?Math.round(my.reduce((a,r)=>a+r.score,0)/my.length):0;let done=new Set(my.map(r=>r.subject+'-'+r.test));shell('dashboard',`<div class="content-head"><div><h2>Halo, ${esc(user.name)}! 👋</h2><p>Terus berlatih, raih hasil terbaikmu.</p></div><span class="pill">KELAS XII</span></div><div class="hero-card" style="min-height:180px;margin-bottom:15px"><div><div class="eyebrow">TKA 2026</div><h2>Belajar hari ini, lebih siap esok hari.</h2><p>Pilih subtes dan ukur pemahamanmu dari hasil latihan.</p></div><div class="hero-art" style="position:absolute;right:25px;bottom:8px;font-size:65px">📚</div></div><div class="grid2"><div class="stat"><small>Subtes selesai</small><strong>${done.size}</strong><span class="muted">dari ${subjects.reduce((a,s)=>a+tests[s.id].length,0)} subtes</span></div><div class="stat"><small>Rata-rata skor simulasi</small><strong>${avg?avg:0}</strong><span class="muted">skala latihan 200–800</span></div></div><div class="section-head"><div><h2>Mulai latihan</h2><p>Setiap subtes punya hasil dan kunci jawaban sendiri.</p></div></div>${subjectRows()}`)}
function subjectRows(){return `<div class="test-list">${subjects.map(s=>`<div class="test-row"><div><span class="pill">${s.type}</span><h3>${s.icon} ${s.name}</h3><p>${tests[s.id].length} subtes · latihan pilihan ganda</p></div><button class="btn primary small" onclick="openSubject('${s.id}')">Pilih subtes →</button></div>`).join('')}</div>`}
function renderTests(){shell('tests',`<div class="content-head"><div><h2>Latihan Soal</h2><p>Pilih mata pelajaran, lalu pilih satu subtes untuk dikerjakan.</p></div></div>${subjectRows()}`)}
function openSubject(id){let s=subjects.find(x=>x.id===id);shell('tests',`<button class="btn secondary small" onclick="go('tests')">← Semua mapel</button><div class="section-head"><div><h2>${s.icon} ${s.name}</h2><p>Subtes dinilai terpisah. Kamu dapat mengulang latihan kapan saja.</p></div></div><div class="test-list">${tests[id].map((t,i)=>{let r=records.find(r=>r.user===user?.name&&r.subject===id&&r.test===i);return `<div class="test-row"><div><span class="pill">SUB TEST ${i+1}</span><h3>${t.title}</h3><p>${t.qs.length} soal latihan · ${t.time} menit ${r?`· Skor terakhir: <b>${r.score}/800</b>`:''}</p></div><button class="btn primary small" onclick="startTest('${id}',${i})">Mulai subtes →</button></div>`}).join('')}</div>`)}
function startTest(id,ti){if(!user)return go('login');current={subject:id,test:ti,index:0,answers:{},started:Date.now(),seconds:tests[id][ti].time*60};renderQuestion()}
function renderQuestion(){let s=subjects.find(x=>x.id===current.subject),t=tests[current.subject][current.test],q=t.qs[current.index],ans=current.answers[current.index];let nav=t.qs.map((q,i)=>`<button class="qnum ${i===current.index?'current':''} ${current.answers[i]!==undefined?'done':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('');document.getElementById('app').innerHTML=`<div class="content-head"><div><span class="pill">${s.name}</span><h2>${t.title}</h2><p>Soal ${current.index+1} dari ${t.qs.length}</p></div><div class="timer" id="timer">⏱ ${t.time}:00</div></div><div class="question-layout"><aside class="qnav"><b>Navigasi soal</b><div class="qgrid">${nav}</div><p style="font-size:12px">🟢 Sudah dijawab<br>⚪ Belum dijawab</p><button class="btn secondary small" style="width:100%" onclick="go('tests')">Keluar subtes</button></aside><article class="questionbox"><div class="eyebrow" style="color:#2163ad">PERTANYAAN ${current.index+1}</div><h3>${q.q}</h3>${q.kind==='graph'?miniGraph():q.kind==='diagram'?physicsDiagram():''}<div class="options">${q.o.map((o,i)=>`<button class="option ${ans===i?'selected':''}" onclick="answerQ(${i})"><span class="letter">${'ABCDE'[i]}</span><span>${o}</span></button>`).join('')}</div><div class="question-actions"><button class="btn secondary small" onclick="prevQ()" ${current.index===0?'disabled':''}>← Sebelumnya</button><button class="btn primary small" onclick="${current.index===t.qs.length-1?'confirmSubmit()':'nextQ()'}">${current.index===t.qs.length-1?'Submit jawaban':'Selanjutnya →'}</button></div></article></div>`;startTimer()}
function miniGraph(){return `<div class="diagram" style="min-height:140px"><svg viewBox="0 0 320 140" width="320" role="img" aria-label="Ilustrasi garis fungsi"><line x1="35" y1="115" x2="300" y2="115" stroke="#789" stroke-width="2"/><line x1="55" y1="130" x2="55" y2="12" stroke="#789" stroke-width="2"/><path d="M75 105 L270 20" stroke="#2877dd" stroke-width="3" fill="none"/><circle cx="170" cy="63" r="5" fill="#e7ad45"/><text x="180" y="57" fill="#234">x mendekati 2</text><text x="280" y="132" fill="#234">x</text><text x="37" y="18" fill="#234">y</text></svg></div>`}
function physicsDiagram(){return `<div class="diagram"><svg viewBox="0 0 320 125" width="320" role="img" aria-label="Ilustrasi konsep fisika"><rect x="22" y="45" width="65" height="42" rx="6" fill="#dbeafe" stroke="#2877dd" stroke-width="2"/><path d="M88 65 H180" stroke="#2877dd" stroke-width="3"/><path d="M170 55 L183 65 L170 75" fill="none" stroke="#2877dd" stroke-width="3"/><text x="34" y="70" fill="#123">Benda</text><text x="102" y="52" fill="#123">Gerak / gaya</text><path d="M220 90 L260 25 L300 90 Z" fill="#e6f5ee" stroke="#159a77" stroke-width="2"/><text x="233" y="106" fill="#123">Model</text></svg></div>`}
let timerInterval=null;function startTimer(){clearInterval(timerInterval);let end=Date.now()+current.seconds*1000;timerInterval=setInterval(()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));let el=document.getElementById('timer');if(el)el.textContent='⏱ '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(timerInterval);submitTest(true)}},1000)}
function answerQ(i){current.answers[current.index]=i;renderQuestion()}function jumpQ(i){current.index=i;renderQuestion()}function nextQ(){let t=tests[current.subject][current.test];if(current.index<t.qs.length-1){current.index++;renderQuestion()}}function prevQ(){if(current.index>0){current.index--;renderQuestion()}}
function confirmSubmit(){let t=tests[current.subject][current.test],unanswered=t.qs.filter((q,i)=>current.answers[i]===undefined).length;if(unanswered&&!confirm(`Masih ada ${unanswered} soal belum dijawab. Tetap submit?`))return;if(confirm('Kirim jawaban dan lihat hasil subtes?'))submitTest(false)}
function submitTest(auto){clearInterval(timerInterval);let t=tests[current.subject][current.test],correct=0;t.qs.forEach((q,i)=>{if(current.answers[i]===q.a)correct++});let result={user:user.name,subject:current.subject,test:current.test,score:Math.round(200+(correct/t.qs.length)*600),correct,total:t.qs.length,date:new Date().toISOString()};records=records.filter(r=>!(r.user===result.user&&r.subject===result.subject&&r.test===result.test));records.push(result);lastResult=result;save();renderResult(result,auto)}
function scoreCategory(score){if(score>=725)return {name:'Istimewa',note:'Ambang Istimewa ≥ 725 mengacu pada informasi TKA 2026; skor latihan ini tetap simulasi.'};if(score>=550)return {name:'Baik',note:'Kategori selain Istimewa adalah perkiraan latihan, bukan kategori resmi.'};if(score>=400)return {name:'Memadai',note:'Kategori selain Istimewa adalah perkiraan latihan, bukan kategori resmi.'};return {name:'Kurang',note:'Kategori selain Istimewa adalah perkiraan latihan, bukan kategori resmi.'}}
function renderResult(r,auto=false){let s=subjects.find(x=>x.id===r.subject),t=tests[r.subject][r.test],cat=scoreCategory(r.score);shell('dashboard',`<div class="content-head"><div><span class="pill">HASIL SUBTES</span><h2>${auto?'Waktu habis. ':'Selesai! '}Kerja bagus, ${esc(user.name)}.</h2><p>${s.name} · ${t.title}</p></div></div><div class="grid2"><div class="stat"><small>Skor simulasi TKA</small><strong>${r.score.toFixed(2)}<span style="font-size:15px;color:var(--muted)"> / 800</span></strong><div class="progress"><span style="width:${((r.score-200)/600)*100}%"></span></div><p><b>${cat.name}</b> · ${r.correct} dari ${r.total} jawaban benar</p><small>${cat.note}</small></div><div class="stat"><small>Langkah selanjutnya</small><strong style="font-size:19px">Pelajari kesalahanmu</strong><p>Lihat kunci jawaban dan pembahasan soal satu per satu.</p></div></div><div class="hero-actions"><button class="btn primary" onclick="reviewTest('${r.subject}',${r.test})">Lihat pembahasan →</button><button class="btn secondary" onclick="showKey('${r.subject}',${r.test})">Kunci jawaban</button><button class="btn secondary" onclick="openSubject('${r.subject}')">Ulangi / subtes lain</button></div>`)}
function showKey(id,ti){let s=subjects.find(x=>x.id===id),t=tests[id][ti];shell('keys',`<div class="content-head"><div><h2>Kunci Jawaban</h2><p>${s.name} · ${t.title}</p></div></div><div class="answer-grid">${t.qs.map((q,i)=>`<div class="answer-cell">No. ${i+1}<b>${'ABCDE'[q.a]}</b><button class="btn secondary small" style="margin-top:8px" onclick="reviewTest('${id}',${ti},${i})">Bahas</button></div>`).join('')}</div><div class="hero-actions"><button class="btn primary" onclick="reviewTest('${id}',${ti})">Buka semua pembahasan</button><button class="btn secondary" onclick="go('keys')">Pilih subtes lain</button></div>`)}
function renderKeys(){shell('keys',`<div class="content-head"><div><h2>Kunci Jawaban</h2><p>Pilih subtes yang sudah kamu kerjakan atau ingin kamu pelajari.</p></div></div><div class="test-list">${subjects.map(s=>`<div class="test-row"><div><h3>${s.icon} ${s.name}</h3><p>${tests[s.id].length} subtes</p></div><div>${tests[s.id].map((t,i)=>`<button class="btn secondary small" style="margin:3px" onclick="showKey('${s.id}',${i})">Sub Test ${i+1}</button>`).join('')}</div></div>`).join('')}</div>`)}
function reviewTest(id,ti,idx=0){let s=subjects.find(x=>x.id===id),t=tests[id][ti],q=t.qs[idx];shell('explain',`<div class="content-head"><div><h2>Pembahasan Soal</h2><p>${s.name} · ${t.title}</p></div></div><div class="test-row" style="margin-bottom:15px"><div><b>Pilih nomor soal</b><p>Buka penjelasan tiap nomor.</p></div><div>${t.qs.map((x,i)=>`<button class="btn ${i===idx?'primary':'secondary'} small" style="margin:2px" onclick="reviewTest('${id}',${ti},${i})">${i+1}</button>`).join('')}</div></div><div class="questionbox"><span class="pill">SOAL ${idx+1}</span><h3>${q.q}</h3><div class="options">${q.o.map((o,i)=>`<div class="option ${i===q.a?'correct':''}"><span class="letter">${'ABCDE'[i]}</span><span>${o} ${i===q.a?'✓ Jawaban benar':''}</span></div>`).join('')}</div><h3 style="margin-top:22px">💡 Pembahasan</h3><p style="color:#213d5c">${q.exp}</p>${q.kind==='graph'?miniGraph():q.kind==='diagram'?physicsDiagram():''}<div class="question-actions"><button class="btn secondary small" onclick="showKey('${id}',${ti})">← Kunci jawaban</button><button class="btn primary small" onclick="reviewTest('${id}',${ti},${(idx+1)%t.qs.length})">Soal berikutnya →</button></div></div>`)}
function renderExplain(){shell('explain',`<div class="content-head"><div><h2>Pembahasan Soal</h2><p>Pembahasan tersedia per subtes, lengkap dengan ilustrasi untuk soal tertentu.</p></div></div><div class="test-list">${subjects.map(s=>`<div class="test-row"><div><h3>${s.icon} ${s.name}</h3><p>Pilih subtes untuk mempelajari cara penyelesaian.</p></div><div>${tests[s.id].map((t,i)=>`<button class="btn secondary small" style="margin:3px" onclick="reviewTest('${s.id}',${i})">Sub Test ${i+1}</button>`).join('')}</div></div>`).join('')}</div>`)}
function renderRank(){let byUser={};records.forEach(r=>{if(!byUser[r.user])byUser[r.user]={scores:[],total:0};byUser[r.user].scores.push(r.score);byUser[r.user].total+=r.score});let rows=Object.entries(byUser).map(([name,d])=>({name,score:Math.round(d.total/d.scores.length),n:d.scores.length})).sort((a,b)=>b.score-a.score);if(user&&!byUser[user.name])rows.push({name:user.name,score:0,n:0});rows.sort((a,b)=>b.score-a.score);shell('rank',`<div class="content-head"><div><h2>🏆 Peringkat Latihan</h2><p>Rata-rata skor simulasi (200–800) dari subtes di browser ini.</p></div></div><div class="panel"><table class="rank-table"><thead><tr><th>#</th><th>Nama peserta</th><th>Rata-rata skor</th><th>Subtes</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr class="${user&&r.name===user.name?'me':''}"><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${esc(r.name)} ${user&&r.name===user.name?'<span class="pill">Kamu</span>':''}</td><td><b>${r.score}</b></td><td>${r.n}</td></tr>`).join(''):`<tr><td colspan="4">Belum ada hasil. Selesaikan subtes untuk muncul di peringkat.</td></tr>`}</tbody></table><p style="font-size:12px">Catatan: peringkat ini bersifat lokal pada perangkat/browser yang digunakan, bukan leaderboard online antarperangkat.</p></div>`)}

function renderStaffDashboard(){let all=JSON.parse(localStorage.getItem('tkaAccounts')||'{}');let students=Object.values(all).filter(a=>(a.role||'student')==='student');let unique= new Set(records.map(r=>r.user));let avg=records.length?Math.round(records.reduce((a,r)=>a+r.score,0)/records.length):0;let isAdmin=user.role==='admin';shell('dashboard',`<div class="content-head"><div><span class="pill">${roleNames[user.role].toUpperCase()}</span><h2>Halo, ${esc(user.name)}!</h2><p>${isAdmin?'Kelola bank soal dan pantau hasil latihan siswa.':'Pantau perkembangan siswa dan bantu mereka memahami materi.'}</p></div></div><div class="grid2"><div class="stat"><small>Akun siswa terdaftar di browser ini</small><strong>${students.length}</strong></div><div class="stat"><small>Rata-rata skor latihan</small><strong>${avg||0}</strong><span class="muted">dari ${records.length} hasil subtes</span></div></div><div class="grid2" style="margin-top:12px"><div class="panel"><h3>📊 Progress siswa</h3><p>Lihat skor, mata pelajaran, subtes, dan waktu pengerjaan yang tercatat.</p><button class="btn primary" onclick="go('progress')">Lihat progress →</button></div><div class="panel"><h3>📝 Bank soal</h3><p>Tambah soal, edit soal, atur kunci jawaban, dan tulis pembahasan.</p><button class="btn primary" onclick="go('manageQuestions')">Kelola soal →</button></div></div><div class="notice">Mode demo: data tersimpan di browser/perangkat ini. Untuk penggunaan satu kelas secara online, dibutuhkan backend dan database bersama.</div>`)}
function getQuestion(id,ti,qi){return tests[id]?.[ti]?.qs?.[qi]}
function persistQuestionEdits(){localStorage.setItem('tkaQuestionEdits',JSON.stringify(tests))}
function renderQuestionManager(){if(!['admin','teacher'].includes(user?.role))return go('dashboard');let subject=window.manageSubject||subjects[0].id,ti=Number(window.manageTest||0);let list=tests[subject]?.[ti]?.qs||[];shell('manageQuestions',`<div class="content-head"><div><h2>Kelola Bank Soal</h2><p>Tambah dan edit soal beserta opsi, kunci jawaban, dan pembahasannya.</p></div></div><div class="notice">Perubahan disimpan di browser ini. Guru dan admin pada perangkat yang sama dapat mengelola soal.</div><div class="panel"><div class="staff-form"><div class="field"><label>Mata pelajaran</label><select id="manageSubject" onchange="window.manageSubject=this.value;window.manageTest=0;renderQuestionManager()">${subjects.map(s=>`<option value="${s.id}" ${s.id===subject?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="field"><label>Subtes</label><select id="manageTest" onchange="window.manageTest=Number(this.value);renderQuestionManager()">${tests[subject].map((t,i)=>`<option value="${i}" ${i===ti?'selected':''}>${t.title}</option>`).join('')}</select></div></div><div class="test-list" style="margin-top:12px">${list.map((q,i)=>`<div class="test-row"><div><b>Soal ${i+1}</b><p>${esc(q.q)}</p><small>Kunci: ${'ABCDE'[q.a]} · Pembahasan ${q.exp?'tersedia':'belum diisi'}</small></div><button class="btn secondary small" onclick="editQuestion('${subject}',${ti},${i})">Edit soal</button></div>`).join('')}</div><div class="hero-actions"><button class="btn primary" onclick="editQuestion('${subject}',${ti},-1)">＋ Tambah soal</button></div></div>`)}
function editQuestion(id,ti,qi){let q=qi>=0?getQuestion(id,ti,qi):{q:'',o:['','','','',''],a:0,exp:'',kind:'text'};let title=qi>=0?'Edit Soal '+(qi+1):'Tambah Soal Baru';shell('manageQuestions',`<div class="content-head"><div><h2>${title}</h2><p>${subjects.find(s=>s.id===id).name} · ${tests[id][ti].title}</p></div></div><form class="panel" onsubmit="saveQuestion(event,'${id}',${ti},${qi})"><div class="field"><label>Pertanyaan</label><textarea id="editQ" required>${esc(q.q)}</textarea></div>${q.o.map((o,i)=>`<div class="field"><label>Opsi ${'ABCDE'[i]}</label><input id="editO${i}" required value="${esc(o)}"></div>`).join('')}<div class="staff-form"><div class="field"><label>Kunci jawaban</label><select id="editA">${q.o.map((o,i)=>`<option value="${i}" ${i===q.a?'selected':''}>${'ABCDE'[i]}</option>`).join('')}</select></div><div class="field"><label>Jenis ilustrasi</label><select id="editKind"><option value="text" ${q.kind==='text'?'selected':''}>Teks</option><option value="math" ${q.kind==='math'?'selected':''}>Matematika</option><option value="graph" ${q.kind==='graph'?'selected':''}>Grafik</option><option value="diagram" ${q.kind==='diagram'?'selected':''}>Diagram fisika</option></select></div></div><div class="field"><label>Pembahasan / cara penyelesaian</label><textarea id="editExp" required>${esc(q.exp)}</textarea></div><div class="hero-actions"><button class="btn primary" type="submit">Simpan soal</button><button class="btn secondary" type="button" onclick="go('manageQuestions')">Batal</button>${qi>=0?`<button class="btn secondary" type="button" onclick="deleteQuestion('${id}',${ti},${qi})">Hapus soal</button>`:''}</div></form>`)}
function saveQuestion(e,id,ti,qi){e.preventDefault();let q={q:document.getElementById('editQ').value.trim(),o:[0,1,2,3,4].map(i=>document.getElementById('editO'+i).value.trim()),a:Number(document.getElementById('editA').value),exp:document.getElementById('editExp').value.trim(),kind:document.getElementById('editKind').value};if(qi<0)tests[id][ti].qs.push(q);else tests[id][ti].qs[qi]=q;persistQuestionEdits();toast('Soal dan pembahasan tersimpan');renderQuestionManager()}
function deleteQuestion(id,ti,qi){if(!confirm('Hapus soal ini?'))return;tests[id][ti].qs.splice(qi,1);persistQuestionEdits();toast('Soal dihapus');renderQuestionManager()}
function renderStudentProgress(){if(!['admin','teacher'].includes(user?.role))return go('dashboard');let accounts=JSON.parse(localStorage.getItem('tkaAccounts')||'{}');let names=Object.values(accounts).filter(a=>(a.role||'student')==='student').map(a=>a.name);let grouped=names.map(name=>{let rs=records.filter(r=>r.user===name);return {name,rs,avg:rs.length?Math.round(rs.reduce((a,r)=>a+r.score,0)/rs.length):0}}).sort((a,b)=>b.avg-a.avg);shell('progress',`<div class="content-head"><div><h2>Progress Siswa</h2><p>Pantau jumlah subtes selesai, rata-rata skor, dan hasil tiap siswa.</p></div></div><div class="notice">Data progres yang muncul adalah hasil latihan yang tersimpan pada browser ini, bukan data kelas online lintas perangkat.</div><div class="test-list">${grouped.length?grouped.map(st=>`<div class="panel"><div class="content-head"><div><h3 style="margin:0">${esc(st.name)}</h3><p>${st.rs.length} subtes selesai · rata-rata ${st.avg||0}/800</p></div><span class="pill">${st.rs.length?'AKTIF':'BELUM LATIHAN'}</span></div>${st.rs.length?`<table class="rank-table"><thead><tr><th>Mata pelajaran</th><th>Subtes</th><th>Skor</th><th>Tanggal</th></tr></thead><tbody>${st.rs.map(r=>`<tr><td>${subjects.find(s=>s.id===r.subject)?.name||r.subject}</td><td>${Number(r.test)+1}</td><td><b>${r.score}</b></td><td>${new Date(r.date).toLocaleDateString('id-ID')}</td></tr>`).join('')}</tbody></table>`:'<p>Siswa belum menyelesaikan subtes.</p>'}</div>`).join(''):'<div class="panel">Belum ada akun siswa. Siswa perlu mendaftar terlebih dahulu.</div>'}`)}
function renderProfile(){let mine=records.filter(r=>r.user===user.name);shell('profile',`<div class="content-head"><div><h2>Profil Peserta</h2><p>Informasi akun latihanmu.</p></div></div><div class="panel"><div class="cap" style="width:60px;height:60px;font-size:30px">👤</div><h2>${esc(user.name)}</h2><p>${esc(user.email)} · <b>${roleNames[user.role]||'Siswa'}</b></p><div class="grid2"><div class="stat"><small>Subtes diselesaikan</small><strong>${mine.length}</strong></div><div class="stat"><small>Skor terbaik</small><strong>${mine.length?Math.max(...mine.map(r=>r.score)):0}</strong></div></div><div class="hero-actions"><button class="btn secondary" onclick="logout()">Keluar dari akun</button></div><p style="font-size:12px">Akun demo disimpan di browser ini. Jangan gunakan kata sandi asli atau informasi sensitif.</p></div>`)}
function renderAuth(mode){let reg=mode==='register';document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="panel"><div style="text-align:center"><div class="cap" style="margin:auto">🎓</div><div class="eyebrow" style="margin-top:15px">TKA 2026 · KELAS XII</div><h2>${reg?'Buat akun latihan':'Selamat datang kembali'}</h2><p>${reg?'Daftar untuk menyimpan progres latihan di browser ini.':'Login untuk melanjutkan latihanmu.'}</p></div><form onsubmit="auth(event,${reg})">${reg?`<div class="field"><label>Nama lengkap</label><input id="authName" required maxlength="40" placeholder="Nama kamu"></div><div class="field"><label>Masuk sebagai</label><select id="authRole" required><option value="student">Siswa</option><option value="teacher">Guru</option><option value="admin">Admin</option></select></div>`:''}<div class="field"><label>Email</label><input id="authEmail" type="email" required placeholder="nama@email.com"></div><div class="field"><label>Kata sandi</label><input id="authPass" type="password" minlength="4" required placeholder="Minimal 4 karakter"></div><button class="btn primary" style="width:100%;margin-top:8px">${reg?'Daftar akun':'Login'}</button></form><p style="text-align:center">${reg?'Sudah punya akun?':'Belum punya akun?'} <a href="#" style="color:#81baff" onclick="event.preventDefault();go('${reg?'login':'register'}')">${reg?'Login':'Daftar'}</a></p><p style="font-size:12px">Demo front-end: akun dan peran disimpan di browser. Untuk produksi, peran admin/guru wajib diverifikasi oleh server.</p></div></div>`}
function auth(e,reg){e.preventDefault();let email=document.getElementById('authEmail').value.trim().toLowerCase(),pass=document.getElementById('authPass').value;let accounts=JSON.parse(localStorage.getItem('tkaAccounts')||'{}');if(reg){let name=document.getElementById('authName').value.trim();if(accounts[email])return toast('Email sudah terdaftar di browser ini.');let role=document.getElementById('authRole')?.value||'student';accounts[email]={name,pass,role};localStorage.setItem('tkaAccounts',JSON.stringify(accounts));user={name,email,role};save();toast('Akun latihan berhasil dibuat!');go('dashboard')}else{if(!accounts[email]||accounts[email].pass!==pass)return toast('Email atau kata sandi tidak cocok.');user={name:accounts[email].name,email,role:accounts[email].role||'student'};save();toast('Login berhasil!');go('dashboard')}}
function logout(){user=null;localStorage.removeItem('tkaUser');go('home');toast('Kamu sudah keluar.')}
go('home');
</script></body></html>
